ignoreWorkspaceRootCheck: true
shellEmulator: true
trustPolicy: no-downgrade
strictPeerDependencies: false
trustPolicyExclude:
  - chokidar@4.0.3
  - rxjs@7.8.2
packages:
  - packages/*
  - examples/*
  - test/*
overrides:
  '@types/node': $@types/node
  vite: $vite
onlyBuiltDependencies:
  - esbuild
